name: CI

on:
  push:
    branches: [main, 'ci/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-Search

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ALICE-Search

      - name: Build (default)
        working-directory: ALICE-Search
        run: cargo build --lib

      - name: Test
        working-directory: ALICE-Search
        run: cargo test --lib

      # Every optional feature on its own (read from Cargo.toml), so a bridge no other step builds cannot
      # break unseen
      - name: Test the feature check
        working-directory: ALICE-Search
        run: python3 scripts/feature_check.py --self-test

      - name: Check each optional feature
        working-directory: ALICE-Search
        run: python3 scripts/feature_check.py --ci

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

      # This crate must not depend on rkyv directly or archive anything through it
      # (scripts/no_direct_rkyv.py, kept byte-identical across repositories)
      - name: no-direct-rkyv guard (tests)
        run: python3 scripts/test_no_direct_rkyv.py
      - name: no-direct-rkyv guard
        run: python3 scripts/no_direct_rkyv.py

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

