[package]
name = "alice-search"
version = "0.2.0"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "FM-Index based full-text search. Compressed and fast."
license = "LicenseRef-Proprietary"
repository = "https://github.com/ext-sakamoro/ALICE-Search"
keywords = ["search", "fm-index", "bwt", "compression", "alice"]
categories = ["algorithms", "compression", "text-processing"]
publish = false

[lib]
name = "alice_search"
crate-type = ["rlib", "cdylib"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
ffi = ["std"]
text = ["dep:alice-text", "std"]         # ALICE-Text compressed text search
analytics = ["dep:alice-analytics", "std"]  # ALICE-Analytics search query metrics
# `alice-db/fs`: `AliceDB::open` (file-backed) is behind that feature in alice-db 0.5
db = ["dep:alice-db", "alice-db/fs", "std"]  # ALICE-DB search metrics persistence
cache = ["dep:alice-cache", "std"]  # ALICE-Cache search result caching

[dependencies]
alice-text = { git = "https://github.com/ext-sakamoro/ALICE-Text", branch = "main", version = "2.0.0", optional = true }
alice-analytics = { git = "https://github.com/ext-sakamoro/ALICE-Analytics", branch = "main", version = "0.7.0", optional = true, default-features = false, features = ["std"] }
alice-db = { git = "https://github.com/ext-sakamoro/ALICE-DB", branch = "main", version = "0.6", optional = true, default-features = false }
alice-cache = { git = "https://github.com/ext-sakamoro/ALICE-Cache", branch = "main", version = "0.2.0", optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "search_bench"
harness = false

[[example]]
name = "full_text_search"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
